<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="icon" href="data:," />
<title>LIKEAI 可视化 HTML PPT 编辑器</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #12161c;
    --panel-2: #171d25;
    --paper: #f5efe3;
    --muted: #9aa5b1;
    --line: #27313d;
    --ink: #10141a;
    --blue: #315cff;
    --blue-soft: #6d86ff;
    --orange: #ff6a3d;
    --green: #30d98f;
    --danger: #ff4d57;
    --topbar: 72px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    --sans: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --display: "Arial Black", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: hidden;
    background:
      linear-gradient(120deg, rgba(49,92,255,.14), transparent 28%),
      linear-gradient(180deg, #0b0d10, #0e1217 72%, #0b0d10);
    color: var(--paper);
    font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; }
  button {
    min-height: 34px;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 13px;
    background: transparent;
    color: var(--paper);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .06em;
    transition: transform .14s ease, border-color .14s ease, background .14s ease, color .14s ease;
    white-space: nowrap;
  }
  button:hover:not(:disabled) {
    border-color: var(--blue-soft);
    background: rgba(49,92,255,.12);
    transform: translateY(-1px);
  }
  button:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  button:disabled { opacity: .45; cursor: not-allowed; transform: none; }
  button.primary {
    border-color: var(--blue);
    background: var(--blue);
    color: white;
    box-shadow: 0 18px 40px rgba(49,92,255,.24);
  }
  button.success {
    border-color: rgba(48,217,143,.55);
    color: var(--green);
  }
  button.danger { color: var(--danger); }
  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  header {
    min-height: var(--topbar);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    padding: 12px 18px 12px 20px;
    border-bottom: 1px solid var(--line);
    background: rgba(11,13,16,.92);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 220px;
  }
  .brand-mark {
    display: inline-flex;
    align-items: center;
    min-height: 42px;
    padding: 5px 12px 3px;
    transform: rotate(-1.5deg);
    background: var(--paper);
    color: var(--blue);
    font-family: var(--display);
    font-size: 28px;
    line-height: .95;
  }
  .brand-copy {
    display: flex;
    min-width: 0;
    flex-direction: column;
    gap: 1px;
  }
  .brand-copy strong {
    color: var(--paper);
    font-size: 15px;
    font-weight: 900;
    line-height: 1.15;
    white-space: nowrap;
  }
  .brand-copy span {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  .actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    min-width: 0;
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    max-width: 300px;
    min-height: 34px;
    padding: 7px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .status-pill::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    flex: 0 0 auto;
  }
  .status-pill.dirty::before { background: var(--orange); }
  .status-pill[hidden] { display: none; }
  main {
    flex: 1;
    min-height: 0;
    display: flex;
  }
  .source-scrim[hidden] { display: none; }
  .source-scrim {
    position: fixed;
    z-index: 60;
    inset: var(--topbar) 0 0;
    background: rgba(0,0,0,.38);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .source-pane {
    position: fixed;
    z-index: 70;
    top: var(--topbar);
    left: 0;
    bottom: 0;
    width: min(560px, calc(100vw - 28px));
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    background: var(--panel);
    box-shadow: 28px 0 70px rgba(0,0,0,.45);
    transform: translateX(-102%);
    transition: transform .22s ease;
  }
  .source-pane.open { transform: translateX(0); }
  .source-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    background: #0b0d10;
  }
  .source-title {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .source-title strong { font-weight: 900; }
  .source-title span {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
  }
  .icon-btn {
    width: 32px;
    min-width: 32px;
    height: 32px;
    min-height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  textarea {
    flex: 1;
    min-height: 0;
    resize: none;
    border: 0;
    outline: 0;
    padding: 18px 20px;
    background: #090b0e;
    color: var(--paper);
    font: 13px/1.6 var(--mono);
    tab-size: 2;
    caret-color: var(--orange);
  }
  .preview-pane {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }
  .preview-head {
    min-height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(13,17,22,.86);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .preview-head strong {
    color: var(--paper);
    font-size: 12px;
  }
  .preview-hint {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-transform: none;
    letter-spacing: 0;
    font-family: var(--sans);
    font-size: 12px;
  }
  .frame-shell {
    flex: 1;
    min-height: 0;
    padding: 14px;
    background:
      linear-gradient(90deg, rgba(245,239,227,.055) 1px, transparent 1px),
      linear-gradient(180deg, rgba(245,239,227,.055) 1px, transparent 1px),
      #0b0d10;
    background-size: 24px 24px;
  }
  iframe {
    width: 100%;
    height: 100%;
    display: block;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: white;
    box-shadow: 0 24px 70px rgba(0,0,0,.46);
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    z-index: 120;
    max-width: min(560px, calc(100vw - 32px));
    padding: 10px 16px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(18,22,28,.96);
    color: var(--paper);
    box-shadow: 0 18px 50px rgba(0,0,0,.34);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 800;
    opacity: 0;
    pointer-events: none;
    transform: translateX(-50%) translateY(8px);
    transition: opacity .18s ease, transform .18s ease;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast.err {
    border-color: rgba(255,77,87,.7);
    background: #3a1116;
    color: #ffd8dc;
  }
  .file-modal[hidden] { display: none; }
  .file-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .file-scrim {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.58);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .file-panel {
    position: relative;
    width: min(560px, calc(100vw - 32px));
    max-height: min(680px, calc(100vh - 48px));
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
    box-shadow: 0 28px 80px rgba(0,0,0,.48);
    animation: modalIn .18s ease forwards;
  }
  @keyframes modalIn {
    from { transform: translateY(8px) scale(.98); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }
  .file-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    padding: 22px 22px 12px;
  }
  .file-head p {
    margin: 0 0 4px;
    color: var(--orange);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 900;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .file-head h2 {
    margin: 0;
    font-size: 22px;
    line-height: 1.2;
  }
  .file-sub {
    margin-top: 8px;
    color: var(--muted);
    font-size: 13px;
  }
  .file-list {
    overflow: auto;
    padding: 8px 14px 16px;
  }
  .file-option {
    width: 100%;
    display: grid;
    grid-template-columns: 40px minmax(0,1fr) auto;
    align-items: center;
    gap: 12px;
    margin: 6px 0;
    padding: 12px;
    border-radius: 8px;
    text-align: left;
    text-transform: none;
    letter-spacing: 0;
    font-family: var(--sans);
  }
  .file-option:hover {
    background: rgba(49,92,255,.14);
  }
  .file-icon {
    width: 40px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
    background: var(--paper);
    color: var(--blue);
    font-family: var(--display);
    font-size: 13px;
  }
  .file-name {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--paper);
    font-weight: 800;
  }
  .file-meta {
    display: block;
    color: var(--muted);
    font-size: 12px;
  }
  .file-pick {
    color: var(--green);
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 900;
  }
  .file-foot {
    display: flex;
    justify-content: flex-end;
    padding: 14px 22px 20px;
    border-top: 1px solid var(--line);
  }
  @media (max-width: 920px) {
    :root { --topbar: 168px; }
    header {
      align-items: flex-start;
      flex-direction: column;
      gap: 12px;
    }
    .actions {
      width: 100%;
      justify-content: flex-start;
      flex-wrap: wrap;
    }
    .preview-head {
      align-items: flex-start;
      flex-direction: column;
      gap: 4px;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="brand-mark">LIKEAI</span>
      <span class="brand-copy">
        <strong>可视化 HTML PPT 编辑器</strong>
        <span>text style · color · media · export</span>
      </span>
    </div>
    <div class="actions">
      <button id="openFolderBtn" class="primary" title="打开包含 HTML 和 assets 的文件夹">打开文件夹</button>
      <span id="folderStatus" class="status-pill" hidden></span>
      <button id="sourceBtn" title="查看或手动修改 HTML 源码">源码</button>
      <button id="loadDemo">载入示例</button>
      <button id="overwriteBtn" class="success" disabled title="先打开包含 HTML 的文件夹">覆盖原文件</button>
      <button id="exportBtn" class="primary">导出新文件</button>
    </div>
  </header>

  <div class="toast" id="toast"></div>

  <div class="file-modal" id="filePickerModal" hidden role="dialog" aria-modal="true" aria-labelledby="filePickerTitle">
    <div class="file-scrim" data-file-picker-cancel></div>
    <section class="file-panel">
      <div class="file-head">
        <div>
          <p>Open folder</p>
          <h2 id="filePickerTitle">选择要编辑的 HTML</h2>
          <div class="file-sub" id="filePickerSub">这个文件夹里有多个 HTML 文件。</div>
        </div>
        <button class="icon-btn" type="button" id="filePickerClose" title="关闭">×</button>
      </div>
      <div class="file-list" id="filePickerList"></div>
      <div class="file-foot">
        <button type="button" id="filePickerCancel">取消</button>
      </div>
    </section>
  </div>

  <div class="source-scrim" id="sourceScrim" hidden></div>
  <main>
    <section class="source-pane" id="sourcePane">
      <div class="source-head">
        <span class="source-title">
          <strong>HTML 源码</strong>
          <span>可手动修复；编辑后会重新渲染预览</span>
        </span>
        <button class="icon-btn" id="closeSourceBtn" title="关闭源码">×</button>
      </div>
      <textarea id="srcInput" spellcheck="false" placeholder="打开 HTML 或粘贴源码后即可编辑。"></textarea>
    </section>

    <section class="preview-pane">
      <div class="preview-head">
        <strong>预览与可视化编辑</strong>
        <span class="preview-hint">点击文字可改内容、颜色、字号、背景和字形 · 点击图片/视频可替换</span>
      </div>
      <div class="frame-shell">
        <iframe id="preview" sandbox="allow-same-origin allow-scripts allow-popups"></iframe>
      </div>
    </section>
  </main>
</div>

<script>
(() => {
  const srcInput = document.getElementById('srcInput');
  const preview = document.getElementById('preview');
  const exportBtn = document.getElementById('exportBtn');
  const loadDemo = document.getElementById('loadDemo');
  const openFolderBtn = document.getElementById('openFolderBtn');
  const overwriteBtn = document.getElementById('overwriteBtn');
  const folderStatus = document.getElementById('folderStatus');
  const sourceBtn = document.getElementById('sourceBtn');
  const sourcePane = document.getElementById('sourcePane');
  const sourceScrim = document.getElementById('sourceScrim');
  const closeSourceBtn = document.getElementById('closeSourceBtn');
  const toastEl = document.getElementById('toast');
  const filePickerModal = document.getElementById('filePickerModal');
  const filePickerList = document.getElementById('filePickerList');
  const filePickerSub = document.getElementById('filePickerSub');
  const filePickerClose = document.getElementById('filePickerClose');
  const filePickerCancel = document.getElementById('filePickerCancel');

  const SUPPORTS_FSA = typeof window.showDirectoryPicker === 'function';
  const EDITABLE_TAGS = new Set([
    'P','SPAN','H1','H2','H3','H4','H5','H6','LI','A','BUTTON','LABEL','TD','TH',
    'BLOCKQUOTE','FIGCAPTION','STRONG','EM','SMALL','DT','DD','SUMMARY','CAPTION','DIV'
  ]);

  let dirHandle = null;
  let assetsDirHandle = null;
  let htmlHandle = null;
  let htmlName = null;
  let isDirty = false;
  let sourceTimer = null;
  const blobURLs = [];

  function showToast(msg, isErr) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('err', !!isErr);
    toastEl.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => toastEl.classList.remove('show'), 2600);
  }

  function setDirty(next) {
    isDirty = !!next;
    updateFileUI();
  }

  function updateFileUI() {
    overwriteBtn.disabled = !htmlHandle;
    overwriteBtn.title = htmlHandle ? '原地覆盖 ' + htmlName : '先打开包含 HTML 的文件夹';
    if (htmlName || dirHandle) {
      folderStatus.textContent = (dirHandle ? (dirHandle.name || '已打开文件夹') + ' / ' : '') + (htmlName || '未命名') + (isDirty ? ' · 有修改' : ' · 已同步');
      folderStatus.classList.toggle('dirty', isDirty);
      folderStatus.hidden = false;
    } else {
      folderStatus.hidden = true;
    }
  }

  if (!SUPPORTS_FSA) {
    openFolderBtn.disabled = true;
    openFolderBtn.title = '当前浏览器不支持文件系统访问，请使用电脑端 Chrome / Edge / Arc';
  }

  function freeBlobURLs() {
    while (blobURLs.length) URL.revokeObjectURL(blobURLs.pop());
  }

  async function ensureAssetsDir() {
    if (assetsDirHandle) return assetsDirHandle;
    if (!dirHandle) return null;
    assetsDirHandle = await dirHandle.getDirectoryHandle('assets', { create: true });
    return assetsDirHandle;
  }

  function sanitizeAssetName(raw, fallbackBase) {
    const fallback = fallbackBase || 'media';
    const original = String(raw || '').trim();
    const dot = original.lastIndexOf('.');
    const hasExt = dot > 0 && dot < original.length - 1;
    const rawBase = hasExt ? original.slice(0, dot) : original;
    const rawExt = hasExt ? original.slice(dot) : '';
    const base = rawBase
      .replace(/[^\p{L}\p{N}._-]+/gu, '-')
      .replace(/^[.-]+|[.-]+$/g, '') || fallback;
    const ext = rawExt.replace(/[^A-Za-z0-9.]+/g, '').replace(/^\.+/, '.');
    return base + ext;
  }

  async function uniqueAssetName(suggested) {
    await ensureAssetsDir();
    const dot = suggested.lastIndexOf('.');
    const base = dot > 0 ? suggested.slice(0, dot) : suggested;
    const ext = dot > 0 ? suggested.slice(dot) : '';
    let name = suggested;
    let i = 1;
    while (true) {
      try {
        await assetsDirHandle.getFileHandle(name);
      } catch {
        return name;
      }
      name = base + '-' + i++ + ext;
    }
  }

  window.__visualPptWriteAsset = async function(file, kind) {
    if (!dirHandle || !SUPPORTS_FSA) return null;
    try {
      await ensureAssetsDir();
      const safe = sanitizeAssetName(file.name, kind === 'video' ? 'video' : 'image');
      const finalName = await uniqueAssetName(safe);
      const fh = await assetsDirHandle.getFileHandle(finalName, { create: true });
      const writable = await fh.createWritable();
      await writable.write(file);
      await writable.close();
      const blobURL = URL.createObjectURL(file);
      blobURLs.push(blobURL);
      return { relPath: 'assets/' + finalName, blobURL };
    } catch (e) {
      console.error(e);
      showToast('媒体写入失败：' + e.message, true);
      return null;
    }
  };

  window.__visualPptBindAssets = async function(idoc) {
    if (!assetsDirHandle) return;
    const nodes = idoc.querySelectorAll('img, video, source');
    for (const node of nodes) {
      const orig = node.getAttribute('src') || '';
      if (!orig.startsWith('assets/')) continue;
      const name = orig.slice('assets/'.length);
      if (!name || name.includes('/')) continue;
      try {
        const fh = await assetsDirHandle.getFileHandle(name);
        const file = await fh.getFile();
        const url = URL.createObjectURL(file);
        blobURLs.push(url);
        node.dataset.srcOriginal = orig;
        node.src = url;
        if (node.tagName === 'SOURCE' && node.parentElement && node.parentElement.tagName === 'VIDEO') {
          try { node.parentElement.load(); } catch {}
        }
      } catch {
        // Keep broken references visible to the user.
      }
    }
  };

  window.__visualPptDirty = function() {
    setDirty(true);
    scheduleSourceSync();
  };

  window.__visualPptToast = function(msg, isErr) {
    showToast(msg, isErr);
  };

  function chooseHTMLFile(htmls, folderName) {
    return new Promise(resolve => {
      filePickerList.innerHTML = '';
      filePickerSub.textContent = (folderName || '当前文件夹') + ' 里有 ' + htmls.length + ' 个 HTML 文件。';
      let settled = false;
      const cleanup = value => {
        if (settled) return;
        settled = true;
        filePickerModal.hidden = true;
        document.removeEventListener('keydown', onKeydown);
        filePickerClose.removeEventListener('click', onCancel);
        filePickerCancel.removeEventListener('click', onCancel);
        filePickerModal.querySelector('[data-file-picker-cancel]').removeEventListener('click', onCancel);
        resolve(value);
      };
      const onCancel = () => cleanup(null);
      const onKeydown = e => {
        if (e.key === 'Escape') cleanup(null);
      };

      htmls.forEach((item, index) => {
        const option = document.createElement('button');
        option.type = 'button';
        option.className = 'file-option';
        option.innerHTML =
          '<span class="file-icon">HTML</span>' +
          '<span><span class="file-name"></span><span class="file-meta">网页文件 · #' + (index + 1) + '</span></span>' +
          '<span class="file-pick">打开</span>';
        option.querySelector('.file-name').textContent = item.name;
        option.addEventListener('click', () => cleanup(item));
        filePickerList.appendChild(option);
      });

      filePickerClose.addEventListener('click', onCancel);
      filePickerCancel.addEventListener('click', onCancel);
      filePickerModal.querySelector('[data-file-picker-cancel]').addEventListener('click', onCancel);
      document.addEventListener('keydown', onKeydown);
      filePickerModal.hidden = false;
      requestAnimationFrame(() => filePickerList.querySelector('.file-option')?.focus());
    });
  }

  async function openFolder() {
    if (!SUPPORTS_FSA) return;
    try {
      const dh = await window.showDirectoryPicker({ mode: 'readwrite' });
      let perm = await dh.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') perm = await dh.requestPermission({ mode: 'readwrite' });
      if (perm !== 'granted') {

      }
      htmls.sort((a, b) => a.name.localeCompare(b.name, 'zh-Hans-CN', { numeric: true, sensitivity: 'base' }));
      if (!htmls.length) {
        showToast('文件夹里没有 .html 文件', true);
        return;
      }

      let chosen = htmls[0];
      if (htmls.length > 1) {
        chosen = await chooseHTMLFile(htmls, dh.name);
        if (!chosen) return;
      }

      freeBlobURLs();
      dirHandle = dh;
      htmlHandle = chosen.handle;
      htmlName = chosen.name;
      assetsDirHandle = null;
      try { assetsDirHandle = await dh.getDirectoryHandle('assets'); } catch {}

      setDirty(false);

    const runtimeWithAssets =
      '(async function(){' +
      'try{ if(window.parent && window.parent.__visualPptBindAssets) await window.parent.__visualPptBindAssets(document); }catch(e){ console.error(e); }' +
      RUNTIME_SCRIPT +
      '})();';
    const scriptTag = '<script id="__visual_ppt_runtime__">' + runtimeWithAssets.replace(/<\/script/gi, '<\\/script') + '<\/script>';
    let next = html;
    if (/<\/head>/i.test(next)) next = next.replace(/<\/head>/i, styleTag + '</head>');
    else next = next.replace(/<html([^>]*)>/i, '<html$1><head><meta charset="utf-8">' + styleTag + '</head>');
    if (/<\/body>/i.test(next)) next = next.replace(/<\/body>/i, scriptTag + '</body>');
    else next += scriptTag;
    return next;
  }

  function renderPreview(html) {
    const isFull = /<html[\s>]/i.test(html);
    const finalHTML = isFull ? html : '<!doctype html><html><head><meta charset="utf-8"></head><body>' + html + '</body></html>';
    preview.srcdoc = injectEditorRuntime(finalHTML);
  }

  function scheduleSourceRender() {
    clearTimeout(sourceTimer);
    sourceTimer = setTimeout(() => {
      renderPreview(srcInput.value);
      setDirty(true);
    }, 220);
  }

  function scheduleSourceSync() {
    clearTimeout(scheduleSourceSync._timer);
    scheduleSourceSync._timer = setTimeout(() => {
      if (document.activeElement === srcInput) return;
      const html = buildExportedHTML();
      if (html) srcInput.value = html;
    }, 350);
  }

  srcInput.addEventListener('input', scheduleSourceRender);

  function setSourceOpen(open) {
    if (open) {
      const html = buildExportedHTML();
      if (html) srcInput.value = html;
    }
    sourcePane.classList.toggle('open', open);
    sourceScrim.hidden = !open;
    sourceBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) requestAnimationFrame(() => srcInput.focus());
  }

  sourceBtn.setAttribute('aria-expanded', 'false');
  sourceBtn.addEventListener('click', () => setSourceOpen(!sourcePane.classList.contains('open')));
  closeSourceBtn.addEventListener('click', () => setSourceOpen(false));
  sourceScrim.addEventListener('click', () => setSourceOpen(false));
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && sourcePane.classList.contains('open')) setSourceOpen(false);
  });

  function buildExportedHTML() {
    const doc = preview.contentDocument;
    if (!doc || !doc.documentElement) return null;
    const clone = doc.documentElement.cloneNode(true);
    clone.querySelectorAll('#__visual_ppt_style__, #__visual_ppt_runtime__, #__visual_ppt_toolbar__').forEach(node => node.remove());
    cleanupPresentationRuntimeState(clone);
    clone.querySelectorAll('[contenteditable]').forEach(node => node.removeAttribute('contenteditable'));
    clone.querySelectorAll('[spellcheck]').forEach(node => {
      if (node.getAttribute('data-editor-editable') === 'true') node.removeAttribute('spellcheck');
    });
    [
      'data-editor-editable',
      'data-media-editable',
      'data-media-selected',
      'data-media-placeholder',
      'data-media-kind'
    ].forEach(attr => clone.querySelectorAll('[' + attr + ']').forEach(node => node.removeAttribute(attr)));
    clone.querySelectorAll('[data-src-original]').forEach(node => {
      node.setAttribute('src', node.getAttribute('data-src-original'));
      node.removeAttribute('data-src-original');
    });
    return '<!doctype html>\n' + clone.outerHTML;
  }

  function cleanupPresentationRuntimeState(root) {
    const scriptsText = [...root.querySelectorAll('script')].map(script => script.textContent || '').join('\n');
    const isRuntimeSlideDeck =
      root.querySelector('#deck') &&
      root.querySelector('#nav-dots') &&
      root.querySelector('.slide') &&
      /navDots\.appendChild|navDots\.append\(|getElementById\(['"]nav-dots['"]\)/.test(scriptsText);
    if (!isRuntimeSlideDeck) return;

    root.querySelectorAll('#nav-dots').forEach(nav => {
      nav.querySelectorAll('.nav-dot').forEach(dot => dot.remove());
    });
    const slides = root.querySelectorAll('.slide');
    slides.forEach((slide, index) => slide.classList.toggle('is-active', index === 0));
    const deck = root.querySelector('#deck');
    if (deck) deck.style.removeProperty('transform');
    const progress = root.querySelector('#progress-bar');
    if (progress && slides.length) progress.style.width = (100 / slides.length) + '%';
    const counter = root.querySelector('#slide-counter');
    if (counter && slides.length) counter.textContent = '01 / ' + String(slides.length).padStart(2, '0');
  }

  function downloadHTML(html, filename) {
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = filename;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function assetNameFromSrc(src) {
    const raw = (src || '').trim();
    if (!raw.startsWith('assets/')) return null;
    const name = raw.slice('assets/'.length).split(/[?#]/)[0];
    if (!name || name.includes('/')) return null;
    try {
      const decoded = decodeURIComponent(name);
      if (!decoded || decoded.includes('/')) return null;
      return decoded;
    } catch {
      return name;
    }
  }

  function collectReferencedAssetNames(html) {
    const parsed = new DOMParser().parseFromString(html, 'text/html');
    const names = new Set();
    parsed.querySelectorAll('img[src], video[src], source[src]').forEach(node => {
      const name = assetNameFromSrc(node.getAttribute('src'));
      if (name) names.add(name);
    });
    return [...names];
  }

  async function uniqueExportFileName(dir, suggested) {
    const safe = (suggested || 'edited-presentation.html')
      .replace(/[\\/:*?"<>|\x00-\x1F]+/g, '-')
      .replace(/^-+|-+$/g, '') || 'edited-presentation.html';
    const withExt = /\.html?$/i.test(safe) ? safe : safe + '.html';
    const dot = withExt.lastIndexOf('.');
    const base = dot > 0 ? withExt.slice(0, dot) : withExt;
    const ext = dot > 0 ? withExt.slice(dot) : '.html';
    let name = withExt;
    let i = 1;
    while (true) {
      try {
        await dir.getFileHandle(name);
      } catch {
        return name;
      }
      name = base + '-' + i++ + ext;
    }
  }

  async function copyReferencedAssetsTo(assetNames, outDir) {
    if (!assetNames.length) return { copied: 0, missing: [] };
    const missing = [];
    let copied = 0;
    let outAssets = null;
    for (const name of assetNames) {
      if (!assetsDirHandle) {
        missing.push(name);
        continue;
      }
      try {
        const srcHandle = await assetsDirHandle.getFileHandle(name);
        const file = await srcHandle.getFile();
        if (!outAssets) outAssets = await outDir.getDirectoryHandle('assets', { create: true });
        const destHandle = await outAssets.getFileHandle(name, { create: true });
        const writable = await destHandle.createWritable();
        await writable.write(file);
        await writable.close();
        copied++;
      } catch (e) {
        console.warn('copy asset failed', name, e);
        missing.push(name);
      }
    }
    return { copied, missing };
  }

  async function exportHTML(html) {
    const filename = htmlName || 'edited-presentation.html';
    const assetNames = collectReferencedAssetNames(html);
    if (!SUPPORTS_FSA || !assetNames.length) {
      downloadHTML(html, filename);
      setDirty(false);
      if (assetNames.length) showToast('已导出 HTML；当前浏览器不能自动导出 assets，请手动复制资源文件夹', true);
      else showToast('已导出新文件');
      return;
    }

    try {
      const outDir = await window.showDirectoryPicker({ mode: 'readwrite' });
      let perm = await outDir.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') perm = await outDir.requestPermission({ mode: 'readwrite' });
      if (perm !== 'granted') {
        showToast('未授予导出目录写入权限', true);
        return;
      }
      const outName = await uniqueExportFileName(outDir, filename);
      const htmlOut = await outDir.getFileHandle(outName, { create: true });
      const writable = await htmlOut.createWritable();
      await writable.write(html);
      await writable.close();
      const result = await copyReferencedAssetsTo(assetNames, outDir);
      setDirty(false);
      if (result.missing.length) showToast('已导出 ' + outName + '，但有 ' + result.missing.length + ' 个资源未复制', true);
      else showToast('已导出 ' + outName + '，并复制 ' + result.copied + ' 个资源');
    } catch (e) {
      if (e.name !== 'AbortError') {
        console.error(e);
        showToast('导出失败：' + e.message, true);
      }
    }
  }

  exportBtn.addEventListener('click', async () => {
    const html = buildExportedHTML();
    if (!html) return;
    await exportHTML(html);
  });

  overwriteBtn.addEventListener('click', async () => {
    if (!htmlHandle) return;
    const html = buildExportedHTML();
    if (!html) return;
    if (!confirm('确认覆盖 ' + htmlName + '？此操作不可撤销。')) return;
    try {
      let perm = await htmlHandle.queryPermission({ mode: 'readwrite' });
      if (perm !== 'granted') perm = await htmlHandle.requestPermission({ mode: 'readwrite' });
      if (perm !== 'granted') {
        showToast('未授予写入权限', true);
        return;
      }
      const writable = await htmlHandle.createWritable();
      await writable.write(html);
      await writable.close();
      srcInput.value = html;
      setDirty(false);
      showToast('已覆盖 ' + htmlName);
    } catch (e) {
      console.error(e);
      showToast('覆盖失败：' + e.message, true);
    }
  });

  const demo = `<!doctype html>

  h1{max-width:920px;margin:26px 0 18px;font:900 clamp(52px,8vw,112px)/.92 var(--display);letter-spacing:.01em}
  h1 span{display:inline-block;background:var(--paper);color:var(--blue);padding:8px 18px 4px;transform:rotate(-1.2deg)}

<body>

    </section>
    <section class="slide">
      <div class="grid">

          <span class="kicker">Visual control</span>

        </div>

      </div>

      <div class="tiles">
        <div class="tile"><h3>字体颜色</h3><p>用色块直接选择。</p></div>
        <div class="tile"><h3>背景颜色</h3><p>适合给标签和标题做强调。</p></div>
        <div class="tile"><h3>字体样式</h3><p>粗体、斜体、下划线、字体族。</p></div>

  loadDemo.addEventListener('click', () => {
    htmlName = null;
    htmlHandle = null;
    dirHandle = null;
    assetsDirHandle = null;
    freeBlobURLs();
    srcInput.value = demo;
    renderPreview(demo);
    setDirty(false);
    showToast('已载入示例');
  });

  loadDemo.click();
})();
</script>
</body>
